# ============================================================
# FeiNiuMusic iOS 14 兼容版构建工作流（修正版）
# 核心修复：Flutter 3.47.x 会在构建时强制把 iOS 部署目标改写成 15.0，
#          导致 iOS 14 设备装上后闪退。锁定 Flutter 3.44.x（迁移目标 13.0），
#          14.0 部署目标才能保留生效。
# 用法：把本文件内容替换 .github/workflows/build_ios.yml 后手动触发。
# ============================================================
name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # 关键：锁 Flutter 3.44.x（Dart 3.12）
      # - 满足本项目依赖约束（pubspec.lock: flutter>=3.44 / dart>=3.12）
      # - 3.44.x 的 iOS 最低部署目标迁移为 13.0，14.0 不会被覆盖
      # - 勿用 3.47.x（强制 15.0，iOS 14 闪退）；勿用 3.24.5（Dart 3.5 装不上依赖）
      - name: 配置 Flutter 3.44.9 环境
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          cache: true

      # connectivity_plus 锁定 6.1.4（6.x 已兼容本项目的 List<ConnectivityResult> API，
      # 避免 7.x 在旧工具链下的编译/兼容问题；如需 7.x 也可去掉此步）
      - name: 锁定 connectivity_plus 兼容版本
        run: |
          python3 -c "
          with open('pubspec.yaml', 'r') as f:
              content = f.read()
          if 'dependency_overrides:' not in content:
              content += '\ndependency_overrides:\n  connectivity_plus: 6.1.4\n'
          with open('pubspec.yaml', 'w') as f:
              f.write(content)
          "

      - name: 预缓存 iOS 引擎
        run: flutter precache --ios

      - name: 获取项目依赖
        run: flutter pub get

      # 统一部署目标 14.0：工程(Runner) + Podfile(平台 + post_install)
      - name: 配置 iOS 14.0 部署目标
        run: |
          python3 -c "
          p = 'ios/Runner.xcodeproj/project.pbxproj'
          s = open(p).read()
          s = s.replace('IPHONEOS_DEPLOYMENT_TARGET = 13.0;', 'IPHONEOS_DEPLOYMENT_TARGET = 14.0;')
          open(p, 'w').write(s)

          p = 'ios/Podfile'
          lines = open(p).readlines()
          out = []
          has_platform = False
          for line in lines:
              st = line.strip()
              if st.startswith('# platform :ios') or st.startswith('platform :ios'):
                  out.append(\"platform :ios, '14.0'\n\")
                  has_platform = True
              elif 'flutter_additional_ios_build_settings(target)' in line:
                  out.append(line)
                  out.append('''    target.build_configurations.each do |config|
              config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '14.0'
            end
''')
              else:
                  out.append(line)
          if not has_platform:
              out.insert(0, \"platform :ios, '14.0'\n\")
          open(p, 'w').write(''.join(out))
          "

      - name: 编译 iOS Release 工程
        run: flutter build ios --release --no-codesign

      - name: 打包并补全签名与 iOS 14 元数据
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/

          # 最低系统版本精确标记为 14.0
          /usr/libexec/PlistBuddy -c "Set :MinimumOSVersion 14.0" Payload/Runner.app/Info.plist 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Add :MinimumOSVersion string 14.0" Payload/Runner.app/Info.plist

          # ad-hoc 本地假签名，巨魔可直接安装
          codesign --force --deep --sign - Payload/Runner.app

          zip -r -y FeiNiuMusic_iOS14.ipa Payload
          rm -rf Payload

      - name: 上传 IPA 产物供下载
        uses: actions/upload-artifact@v4
        with:
          name: FeiNiuMusic-iPad-iOS14
          path: FeiNiuMusic_iOS14.ipa
          retention-days: 7
