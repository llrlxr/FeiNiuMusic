name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置兼容 iOS 14 的 Flutter 环境 (3.24.5)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5' # 锁定 3.24.5，原生兼容 iOS 14.0
          cache: true

      - name: 修复网络插件版本兼容 (锁定 connectivity_plus 6.1.4)
        run: |
          python3 -c "
          with open('pubspec.yaml', 'r') as f:
              content = f.read()
          if 'dependency_overrides:' not in content:
              content += '\ndependency_overrides:\n  connectivity_plus: 6.1.4\n'
          else:
              content += '\n  connectivity_plus: 6.1.4\n'
          with open('pubspec.yaml', 'w') as f:
              f.write(content)
          "

      - name: 预缓存 iOS 引擎
        run: flutter precache --ios

      - name: 获取项目依赖
        run: flutter pub get

      - name: 配置 iOS 14.0 部署目标与依赖兼容
        run: |
          python3 -c "
          with open('ios/Podfile', 'r') as f:
              content = f.read()
          import re
          if re.search(r'#?\s*platform\s+:ios', content):
              content = re.sub(r'#?\s*platform\s+:ios.*', \"platform :ios, '14.0'\", content)
          else:
              content = \"platform :ios, '14.0'\n\" + content
          if 'flutter_additional_ios_build_settings(target)' in content:
              replacement = '''flutter_additional_ios_build_settings(target)
              target.build_configurations.each do |config|
                config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '14.0'
              end'''
              content = content.replace('flutter_additional_ios_build_settings(target)', replacement)
          with open('ios/Podfile', 'w') as f:
              f.write(content)
          "

      - name: 编译 iOS Release 工程
        run: |
          flutter build ios --release --no-codesign

      - name: 打包并补全签名与 iOS 14 元数据
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          
          # 确保最低系统版本精确标记为 14.0
          /usr/libexec/PlistBuddy -c "Set :MinimumOSVersion 14.0" Payload/Runner.app/Info.plist 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :MinimumOSVersion string 14.0" Payload/Runner.app/Info.plist
          
          # 执行 ad-hoc 本地假签名，确保巨魔和所有动态库能正常加载
          codesign --force --deep --sign - Payload/Runner.app
          
          zip -r -y FeiNiuMusic_iOS14.ipa Payload
          rm -rf Payload

      - name: 上传 IPA 产物供下载
        uses: actions/upload-artifact@v4
        with:
          name: FeiNiuMusic-iPad-iOS14
          path: FeiNiuMusic_iOS14.ipa
          retention-days: 7
