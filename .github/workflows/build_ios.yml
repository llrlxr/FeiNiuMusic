name: Build iOS IPA
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 配置 Flutter 3.44.9 环境
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          cache: true
      - name: 锁定 connectivity_plus 兼容版本
        run: |
          python3 -c "
          with open('pubspec.yaml', 'r') as f:
              content = f.read()
          if 'dependency_overrides:' not in content:
              content += '\ndependency_overrides:\n  connectivity_plus: 6.1.4\n'
          with open('pubspec.yaml', 'w') as f:
              f.write(content)
          "
      - name: 预缓存 iOS 引擎
        run: flutter precache --ios
      - name: 获取项目依赖
        run: flutter pub get
      - name: 提升工程部署目标到 14.0
        run: |
          python3 -c "p='ios/Runner.xcodeproj/project.pbxproj'; s=open(p).read().replace('IPHONEOS_DEPLOYMENT_TARGET = 13.0;','IPHONEOS_DEPLOYMENT_TARGET = 14.0;'); open(p,'w').write(s)"
          grep -c 'IPHONEOS_DEPLOYMENT_TARGET = 14.0;' ios/Runner.xcodeproj/project.pbxproj
      - name: 编译 iOS Release 工程
        run: flutter build ios --release --no-codesign
      - name: 打包并补全签名与 iOS 14 元数据
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          /usr/libexec/PlistBuddy -c "Set :MinimumOSVersion 14.0" Payload/Runner.app/Info.plist 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Add :MinimumOSVersion string 14.0" Payload/Runner.app/Info.plist
          codesign --force --deep --sign - Payload/Runner.app
          zip -r -y FeiNiuMusic_iOS14.ipa Payload
          rm -rf Payload
      - name: 创建 GitHub Release 并上传 IPA
        uses: softprops/action-gh-release@v2
        with:
          files: FeiNiuMusic_iOS14.ipa
          tag_name: v1.6.5-ios14
          name: 飞牛音乐 iOS14 版
          body: |
            适配 iPad Air 3 / iOS 14.0 的 IPA 包
            安装方式：下载后用 TrollStore（巨魔）打开安装
          draft: false
          prerelease: false
