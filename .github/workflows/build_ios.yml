name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置兼容 iOS 14 的 Flutter 环境 (3.24.5)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          cache: true

      - name: 解除 Dart 版本限制与锁定插件兼容
        run: |
          python3 -c "
          with open('pubspec.yaml', 'r') as f:
              lines = f.readlines()
          new_lines = []
          in_env = False
          for line in lines:
              stripped = line.strip()
              if stripped.startswith('environment:'):
                  in_env = True
                  new_lines.append(line)
              elif in_env and stripped.startswith('sdk:'):
                  indent = line[:line.find('sdk:')]
                  new_lines.append(f'{indent}sdk: \">=3.0.0 <4.0.0\"\n')
              elif in_env and not line.startswith(' ') and not line.startswith('\t') and stripped:
                  in_env = False
                  new_lines.append(line)
              else:
                  new_lines.append(line)
          content = ''.join(new_lines)
          if 'dependency_overrides:' not in content:
              content += '\ndependency_overrides:\n  connectivity_plus: 6.1.4\n'
          else:
              content += '\n  connectivity_plus: 6.1.4\n'
          with open('pubspec.yaml', 'w') as f:
              f.write(content)
          "

      - name: 预缓存 iOS 引擎
        run: flutter precache --ios

      - name: 获取项目依赖
        run: flutter pub get

      - name: 配置 iOS 14.0 部署目标与依赖兼容
        run: |
          python3 -c "
          with open('ios/Podfile', 'r') as f:
              lines = f.readlines()
          new_lines = []
          has_platform = False
          for line in lines:
              stripped = line.strip()
              if stripped.startswith('# platform :ios') or stripped.startswith('platform :ios'):
                  new_lines.append(\"platform :ios, '14.0'\n\")
                  has_platform = True
              elif 'flutter_additional_ios_build_settings(target)' in line:
                  new_lines.append(line)
                  new_lines.append('''    target.build_configurations.each do |config|
                config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '14.0'
              end\n''')
              else:
                  new_lines.append(line)
          if not has_platform:
              new_lines.insert(0, \"platform :ios, '14.0'\n\")
          content = ''.join(new_lines)
          with open('ios/Podfile', 'w') as f:
              f.write(content)
          "

      - name: 编译 iOS Release 工程
        run: |
          flutter build ios --release --no-codesign

      - name: 打包并补全签名与 iOS 14 元数据
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          
          # 确保最低系统版本精确标记为 14.0
          /usr/libexec/PlistBuddy -c "Set :MinimumOSVersion 14.0" Payload/Runner.app/Info.plist 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :MinimumOSVersion string 14.0" Payload/Runner.app/Info.plist
          
          # 执行 ad-hoc 本地假签名，确保巨魔和所有动态库能正常加载
          codesign --force --deep --sign - Payload/Runner.app
          
          zip -r -y FeiNiuMusic_iOS14.ipa Payload
          rm -rf Payload

      - name: 上传 IPA 产物供下载
        uses: actions/upload-artifact@v4
        with:
          name: FeiNiuMusic-iPad-iOS14
          path: FeiNiuMusic_iOS14.ipa
          retention-days: 7
